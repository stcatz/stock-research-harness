[project]
name = "a-share-research"
version = "0.1.0"
description = "Auditable A-share theme research workflow with a standalone CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
market = ["baostock==0.9.3"]

[project.scripts]
a-share-research = "a_share_research.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
a_share_research = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
