id = "a-share-theme-v1.1"
market = "CN"
purpose = "Research prioritization only; never a trading signal."

[dimensions]
big = "Assess market space and capacity separately."
new = "Identify the new variable relative to prior expectations."
many = "Require a plausible beneficiary set and market breadth."
durable = "Require follow-up catalysts instead of a one-off story."
timely = "Require evidence available before decision_at and relevant now."

[minimum_observe_gates]
official_event = true
structured_market = true
transmission_chain = true
counter_thesis = true
invalidation_conditions = true
next_catalyst = true
time_boundary = true
company_disclosure = true

[quality_layer]
hard_gates_are_not_averaged_away = true
research_priority_range = [0, 100]
continue_research_requires_transition_condition = true
independent_bear_review = true
valuation_scope_must_be_labeled = true

[evaluation]
metric = "benchmark_relative_total_return"
benchmark = "000906.SH"
horizons_trading_days = [5, 20]
sidecar_is_immutable = true

[allowed_decisions]
values = ["exclude", "continue_research", "observe"]

[prohibited]
broker_connection = true
automatic_order = true
target_price = true
deterministic_price_prediction = true
